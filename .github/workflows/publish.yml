name: Semantic Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run unit tests
        run: make test-unit-py${{ matrix.python-version }}

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # for PyPI Trusted Publishing (OIDC)
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify built distributions
        if: steps.semrel.outputs.new_release_published == 'true'
        run: twine check dist/*

      # Sigstore's TUF metadata endpoint occasionally 403s, which kills the
      # attestation step and aborts the whole publish. Retry up to three times;
      # the final attempt disables attestations so a sustained Sigstore outage
      # still gets the package onto PyPI (unattested, but published).
      - name: Publish to PyPI (Trusted Publishing)
        id: pypi_publish
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

      - name: Wait before PyPI retry
        if: ${{ steps.pypi_publish.outcome == 'failure' && steps.semrel.outputs.new_release_published == 'true' }}
        run: |
          echo "PyPI publish failed on first attempt (likely transient Sigstore/TUF error); waiting 60s before retry."
          sleep 60

      - name: Publish to PyPI (retry)
        id: pypi_publish_retry
        if: ${{ steps.pypi_publish.outcome == 'failure' && steps.semrel.outputs.new_release_published == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        continue-on-error: true

      - name: Wait before PyPI fallback publish
        if: ${{ steps.pypi_publish_retry.outcome == 'failure' && steps.semrel.outputs.new_release_published == 'true' }}
        run: |
          echo "PyPI publish still failing after retry; final attempt will disable attestations to bypass Sigstore."
          sleep 60

      - name: Publish to PyPI (final attempt, attestations disabled)
        if: ${{ steps.pypi_publish_retry.outcome == 'failure' && steps.semrel.outputs.new_release_published == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: false

      - name: Build Desktop Extension (.mcpb)
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          cp letterhead_pdf/resources/icon.png dxt/icon.png
          cd dxt && npx --yes @anthropic-ai/mcpb pack

      - name: Attach .mcpb to GitHub release
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.semrel.outputs.new_release_version }}"
          MCPB_FILE="dxt/mac-letterhead-${VERSION}.mcpb"
          # mcpb pack emits dxt/dxt.mcpb on some versions, mac-letterhead-<v>.mcpb on others
          if [ ! -f "$MCPB_FILE" ] && [ -f dxt/dxt.mcpb ]; then
            mv dxt/dxt.mcpb "$MCPB_FILE"
          fi
          gh release upload "v${VERSION}" "$MCPB_FILE" --clobber

      # Publishes/updates Formula/mac-letterhead.rb in easytocloud/homebrew-tap,
      # so `brew install easytocloud/tap/mac-letterhead` picks up the new version.
      # The formula's install step just drops distribution/bin/mac-letterhead in
      # PATH; that shim delegates to uvx, which fetches Mac-letterhead from PyPI
      # at first use.
      #
      # Auth: the tap lives in a different repo, so the default GITHUB_TOKEN
      # (scoped to this repo only) can't commit there. We reuse the same
      # 1Password pattern as easytocloud/ca-uvx and the rest of the tap:
      # OP_SERVICE_ACCOUNT_TOKEN (org secret) unlocks the CICD vault, from
      # which we pull github-easytocloud-brew — a PAT with repo write on
      # easytocloud/homebrew-tap.
      - name: Configure 1Password Service Account
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: 1password/load-secrets-action/configure@v1
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load Homebrew tap GitHub token from 1Password
        id: load-brew-token
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: op://CICD/github-easytocloud-brew/credential

      - name: Publish Homebrew formula to easytocloud/homebrew-tap
        # Kept tolerant: if 1Password auth or the tap repo hits a transient
        # issue, we still want the release itself (PyPI + .mcpb + MCP registry)
        # to complete. Manual retry via workflow_dispatch is straightforward.
        continue-on-error: true
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: Justintime50/homebrew-releaser@v1
        with:
          homebrew_owner: easytocloud
          homebrew_tap: homebrew-tap
          formula_folder: Formula
          github_token: ${{ steps.load-brew-token.outputs.HOMEBREW_TAP_GITHUB_TOKEN }}
          commit_owner: homebrew-releaser
          commit_email: homebrew-releaser@easytocloud.com
          depends_on: |
            "uv"
          install: 'bin.install "distribution/bin/mac-letterhead" => "mac-letterhead"'
          test: 'assert_match("mac-letterhead", shell_output("#{bin}/mac-letterhead --version"))'
          update_readme_table: true
